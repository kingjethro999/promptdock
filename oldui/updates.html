<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta
      name="description"
      content="PromptDock product updates and announcements."
    />
    <title>Updates — PromptDock</title>
    <!--SEO_START-->
    <link rel="canonical" href="{{SITE_URL}}/updates" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="PromptDock updates"
      href="{{SITE_URL}}/feed.xml"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PromptDock" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Updates — PromptDock" />
    <meta
      property="og:description"
      content="PromptDock product updates and announcements."
    />
    <meta property="og:url" content="{{SITE_URL}}/updates" />
    <meta property="og:image" content="{{SITE_URL}}/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PromptDock — Good ideas deserve a clearer prompt"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Updates — PromptDock" />
    <meta
      name="twitter:description"
      content="PromptDock product updates and announcements."
    />
    <meta name="twitter:image" content="{{SITE_URL}}/social-card.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Updates — PromptDock",
        "description": "PromptDock product updates and announcements.",
        "url": "{{SITE_URL}}/updates",
        "inLanguage": "en",
        "isPartOf": {
          "@type": "WebSite",
          "name": "PromptDock",
          "url": "{{SITE_URL}}/"
        }
      }
    </script>
    <!--SEO_END-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/updates.css" />
  </head>
  <body class="updates-page-body">
    <main class="updates-page">
      <header class="updates-page-header">
        <a class="updates-page-brand" href="/"
          ><span class="updates-page-brand-mark">✳</span> prompt<span
            >dock</span
          ></a
        ><a class="updates-page-back" href="/">← Back to workspace</a>
      </header>
      <section class="updates-page-intro">
        <span class="landing-kicker">FROM THE BUILDER</span>
        <h1>What’s new in PromptDock.</h1>
        <p>
          Short notes from King Jethro about what is shipping, what is coming
          next, and how PromptDock is growing.
        </p>
      </section>
      <section
        class="updates-list"
        id="updatesList"
        aria-live="polite"
      ></section>
      <footer class="updates-page-footer">
        Built in the open source community by
        <a
          href="https://github.com/kingjethro999"
          target="_blank"
          rel="noopener noreferrer"
          >King Jethro</a
        >.
      </footer>
    </main>
    <script src="/updates-data.js"></script>
    <script src="/updates-page.js" defer></script>
  </body>
</html>
