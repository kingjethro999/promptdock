services:
  postgres:
    build: .
    environment:
      POSTGRES_DB: promptdock
      POSTGRES_USER: promptdock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - promptdock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptdock -d promptdock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  promptdock_data:
